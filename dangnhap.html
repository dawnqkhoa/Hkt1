<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - HKT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-xl relative">
        <a href="index.html" class="absolute top-6 left-6 text-sm text-green-600 hover:underline">&larr; Quay lại</a>
        <h2 class="text-3xl font-bold text-center mb-8 mt-4">Đăng nhập</h2>
        <input id="loginEmail" type="email" placeholder="Email của bạn" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl mb-4 focus:outline-none focus:border-green-500 focus:bg-white transition-all">
        <input id="loginPassword" type="password" placeholder="Mật khẩu" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl mb-6 focus:outline-none focus:border-green-500 focus:bg-white transition-all">
        <button onclick="handleLogin()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-2xl font-bold text-lg shadow-lg">Đăng nhập</button>
        <p class="text-center mt-6 text-gray-600">Chưa có tài khoản? <a href="dangky.html" class="text-green-600 font-bold hover:underline">Đăng ký ngay</a></p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
